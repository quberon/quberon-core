[package]
name = "quberon-secure-core-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
description = "cargo-fuzz targets for the simulation-only STOP authorization core. Not part of the stable workspace build."

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
quberon-secure-core = { path = "../crates/quberon-secure-core" }
serde_json = "1"

[workspace]

[[bin]]
name = "envelope_parse"
path = "fuzz_targets/envelope_parse.rs"

[[bin]]
name = "audit_record"
path = "fuzz_targets/audit_record.rs"

# cargo-fuzz requires its own profile handling; keep the release profile
# compatible with libFuzzer sanitizers when run via `cargo fuzz`.
[profile.release]
debug = 1

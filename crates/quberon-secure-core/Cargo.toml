[package]
name = "quberon-secure-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Simulation-only STOP authorization boundary. Not a safety-rated e-stop; no physical control."

[dependencies]
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
zeroize = "1"

[dev-dependencies]
proptest = "1"
tempfile = "3"
